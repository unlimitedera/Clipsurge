<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cliptastic</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#0d1117;--sf:#161b22;--ln:#272e3a;--lime:#c6ff3d;--vio:#8b7bff;--org:#ff8a3d;--mu:#7d8798;--tx:#eef2f7;--red:#ff5a5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px Inter,system-ui,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--ln)}
.logo{font-size:28px;font-weight:900;letter-spacing:-.03em}.logo b{color:var(--lime)}.logo em{font-style:normal;display:inline-block;transform:rotate(-8deg);color:var(--org)}
.mu{color:var(--mu)}main{max-width:1280px;margin:0 auto;padding:18px 22px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px}
.drop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:2px dashed var(--ln);transition:.15s}
.drop.over{border-color:var(--lime);background:#1b2212}
input[type=text],select,input[type=number]{background:#0f141b;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit}
input[type=text]{flex:1;min-width:260px}input[type=number]{width:64px}
button{background:var(--lime);color:#0b0f00;font-weight:800;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:800}
button.g{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:600}button:disabled{opacity:.4}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:2px 9px;color:var(--mu);font-size:11px;margin-right:4px}
.layout{display:grid;grid-template-columns:170px 1fr;gap:14px}
.step{display:flex;gap:8px;align-items:center;margin:9px 0;color:var(--mu)}
.step i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;font-style:normal;font-size:10px}
.step.d{color:var(--tx)}.step.d i{background:var(--lime);border-color:var(--lime);color:#111}
.step.a{color:var(--lime)}.step.a i{border-color:var(--lime);box-shadow:0 0 10px var(--lime)}
.bar{height:6px;background:var(--ln);border-radius:4px;overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--vio));transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.clip{background:#10151c;border:1px solid var(--ln);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.clip.off{opacity:.5}
.phone{aspect-ratio:9/16;background:#000;border-radius:14px;border:3px solid #2b3340;overflow:hidden;display:grid;place-items:center;color:var(--mu)}
.phone video{width:100%;height:100%;object-fit:cover}
.score{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lime);color:#111;font-weight:900}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row input[type=number]{width:72px;padding:5px}
.title{font-weight:700;background:transparent;border:1px solid transparent;color:var(--tx);width:100%;padding:3px;border-radius:6px}
.title:focus{border-color:var(--ln);outline:0}
.log{font:11px ui-monospace,Consolas,monospace;color:var(--mu);max-height:70px;overflow:auto}
.err{color:var(--red)}a{color:var(--lime)}
.jobs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.jobs span{cursor:pointer}.jobs .on{background:var(--lime);color:#111;border-color:var(--lime)}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style></head><body>
<header><div><div class="logo">clip<b>tastic</b><em>!</em></div><div class="mu">Any video in. Share-ready shorts out. Runs on your PC.</div></div>
<div class="mu" id="st"></div></header>
<main>
<div class="card drop" id="drop">
 <input type="text" id="url" placeholder="Paste a link (YouTube, Twitch, ...) or drop a video file here">
 <input type="file" id="file" accept="video/*" style="display:none">
 <button class="g" onclick="file.click()" id="pick">Choose file</button>
 <select id="mode"><option value="auto">Auto</option><option value="podcast">Podcast</option><option value="gaming">Gaming</option><option value="tutorial">Tutorial</option></select>
 <label class="mu">Clips <input type="number" id="count" value="5" min="1" max="20"></label>
 <label class="mu">Length <input type="number" id="minlen" value="20"> - <input type="number" id="maxlen" value="55"> s</label>
 <select id="layout"><option value="auto">Crop: auto</option><option value="follow">Follow face</option><option value="stack">Webcam + gameplay</option><option value="fit">Fit + blur</option></select>
 <select id="cap"><option value="pop">Captions: Pop</option><option value="clean">Clean</option><option value="fire">Fire</option><option value="off">Off</option></select>
 <button class="g" id="rec" onclick="rec()">&#9679; Record (OBS)</button>
 <button id="go" onclick="start()">Make clips &#9656;</button>
</div>
<div class="jobs" id="jobs"></div>
<div id="view"></div>
</main>
<script>
const $=id=>document.getElementById(id);let cur=null,timer=null;
const STAGES=["Get video","Transcribe","Find moments","Crop + captions","Export"];
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
$("file").onchange=()=>{if(file.files[0])$("url").value="File: "+file.files[0].name};
const d=$("drop");["dragover","dragenter"].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add("over")}));
["dragleave","drop"].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove("over")}));
d.addEventListener("drop",x=>{if(x.dataTransfer.files[0]){file.files=x.dataTransfer.files;file.onchange()}});
let recording=false;
async function rec(){
 const r=await fetch(recording?"/api/obs/stop":"/api/obs/start",{method:"POST"});
 if(!r.ok){alert((await r.json()).detail);return}
 recording=!recording;$("rec").innerHTML=recording?"&#9632; Stop + clip":"&#9679; Record (OBS)";
 if(!recording){cur=(await r.json()).id;poll()}}
async function search(){
 const q=$("q").value.trim();if(!q)return;
 const r=await (await fetch(`/api/jobs/${cur}/search?q=`+encodeURIComponent(q))).json();
 $("hits").innerHTML=r.length?r.map(h=>`<div class="row" style="margin:6px 0"><span class="mu">${fmt(h.start)}-${fmt(h.end)}</span><span style="flex:1;margin:0 10px">${h.text.slice(0,120)}</span><button class="g" onclick="addClip(${h.start},${h.end},'${q.replace(/'/g,"")}')">Make clip</button></div>`).join(""):'<span class="mu">No matches</span>'}
async function addClip(s,e,t){await fetch(`/api/jobs/${cur}/clips`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({start:s,end:e,title:t})});poll()}
async function sched(id){
 const w=$("w"+id).value;if(!w){alert("Pick a date and time");return}
 const r=await fetch(`/api/jobs/${cur}/clips/${id}/schedule`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({when:w})});
 alert(r.ok?"Scheduled for YouTube (private). Keep Cliptastic running.":"Failed")}
async function start(){
 const f=new FormData();const u=$("url").value.trim();
 if(file.files[0]&&u.startsWith("File:"))f.append("file",file.files[0]);else f.append("url",u);
 for(const [k,v] of [["mode",$("mode").value],["count",$("count").value],["minlen",$("minlen").value],["maxlen",$("maxlen").value],["layout",$("layout").value],["captions",$("cap").value]])f.append(k,v);
 $("go").disabled=true;const r=await fetch("/api/jobs",{method:"POST",body:f});$("go").disabled=false;
 if(!r.ok){alert((await r.json()).detail);return}
 const j=await r.json();cur=j.id;refreshJobs();poll()}
async function refreshJobs(){
 const js=await (await fetch("/api/jobs")).json();
 $("jobs").innerHTML=js.map(j=>`<span class="chip ${j.id==cur?"on":""}" onclick="cur='${j.id}';poll()">${(j.title||j.id).slice(0,34)} · ${j.state}</span>`).join("")}
async function poll(){clearTimeout(timer);if(!cur)return;
 const j=await (await fetch("/api/jobs/"+cur)).json();draw(j);refreshJobs();
 const busy=j.state=="running"||j.state=="queued"||j.clips.some(c=>["queued","rendering"].includes(c.status));
 if(busy)timer=setTimeout(poll,2000)}
function draw(j){
 const steps=STAGES.map((s,i)=>{const c=j.state=="done"||i<j.stage?"d":(i==j.stage&&j.state=="running"?"a":"");return `<div class="step ${c}"><i>${c=="d"?"&#10003;":i+1}</i>${s}</div>`}).join("");
 const clips=j.clips.map(c=>`<div class="clip ${c.approved?"":"off"}">
  <div class="phone">${c.status=="done"?`<video src="/files/${j.id}/${c.file}?t=${Date.now()}" controls loop playsinline></video>`:`<span>${c.status=="error"?"render failed":c.status}...</span>`}</div>
  <div class="row"><input class="title" value="${(c.title||"").replace(/"/g,"&quot;")}" onchange="edit(${c.id},{title:this.value})"><span class="score">${c.score}</span></div>
  <div class="mu">${(c.tags||[]).join(" ")}</div>
  <div class="row"><label class="mu">Start <input type="number" step="0.5" value="${c.start}" id="s${c.id}"></label><label class="mu">End <input type="number" step="0.5" value="${c.end}" id="e${c.id}"></label></div>
  <div class="row"><label class="mu"><input type="checkbox" ${c.approved?"checked":""} onchange="edit(${c.id},{approved:this.checked})"> Keep</label>
   <button class="g" onclick="edit(${c.id},{start:+$('s${c.id}').value,end:+$('e${c.id}').value},true)">Re-render</button>
   ${c.status=="done"?(c.youtube?`<a href="${c.youtube}" target="_blank">On YouTube</a>`:`<button class="g" onclick="up(${c.id})">Upload to YouTube</button>`):""}
   ${c.status=="done"?`<a href="/files/${j.id}/${c.file}" download>MP4</a> <a href="/files/${j.id}/${c.file.replace(".mp4",".srt")}" download>SRT</a> <a href="/files/${j.id}/clips/clip${c.id}.ass" download>ASS</a>`:""}</div>
  ${c.status=="done"&&!c.youtube?`<div class="row"><input type="datetime-local" id="w${c.id}" style="flex:1"><button class="g" onclick="sched(${c.id})">Schedule</button></div>`:""}</div>`).join("");
 $("view").innerHTML=`<div class="layout"><div class="card"><b>Pipeline</b>${steps}<div class="bar"><b style="width:${j.progress}%"></b></div>
  <div class="mu">${j.info?fmt(j.info.duration)+" · "+j.info.width+"x"+j.info.height:""}</div></div>
  <div><div class="card"><b>${j.title||""}</b> <span class="chip">${j.settings.mode}</span><span class="chip">${j.clips.length} moments</span>
  ${j.error?`<div class="err">${j.error}</div>`:""}<div class="log">${(j.log||[]).slice(-6).join("<br>")}</div>
  ${j.clips.length?`<div style="margin-top:8px"><button onclick="fetch('/api/jobs/${j.id}/render',{method:'POST'}).then(poll)">Render kept clips</button></div>`:""}</div>
  <div class="card"><div class="row"><input type="text" id="q" placeholder="Find a moment: &quot;the funny story about the server&quot;" onkeydown="if(event.key=='Enter')search()" style="flex:1"><button class="g" onclick="search()">Search</button> ${j.state=="done"?`<a href="/files/${j.id}/timeline.otio" download>Timeline (.otio)</a> <a href="/files/${j.id}/timeline.edl" download>EDL</a>`:""}</div><div id="hits"></div></div>
  <div class="grid">${clips}</div></div></div>`}
async function up(id){
 const s=await (await fetch("/api/youtube")).json();
 if(!s.client_file){alert("Add your Google OAuth file at F:/Cliptastic/secrets/client_secret.json first (see README).");return}
 if(!s.connected){const r=await fetch("/api/youtube/connect",{method:"POST"});if(!r.ok){alert((await r.json()).detail);return}}
 const r=await fetch(`/api/jobs/${cur}/clips/${id}/upload?privacy=private`,{method:"POST"});
 if(!r.ok)alert((await r.json()).detail);poll()}
async function edit(id,body,render){
 const r=await fetch(`/api/jobs/${cur}/clips/${id}?render=${render?"true":"false"}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(!r.ok)alert((await r.json()).detail);poll()}
fetch("/api/status").then(r=>r.json()).then(s=>$("st").textContent=s.llm?"Local AI: "+s.llm:"Local AI: off (using audio + speech scoring)");
refreshJobs();
</script></body></html>
